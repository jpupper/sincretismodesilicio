# ============================================================================
#  SINCRETISMO DE SILICIO — APLICAR EN EL VPS (lo agrega el usuario a mano)
# ============================================================================
#  App:    /root/sincretismodesilicio   (Express / Laya + Ollama proxy + WS)
#  Puerto: 6932                          (PM2: sincretismodesilicio)
#
#  ARCHIVO A EDITAR:  /etc/nginx/sites-available/vps-4455523-x
#  Insertar este bloque JUSTO ANTES de la línea:
#      # --- BLOQUE DEFINITIVO PARA TODAS LAS APPS DE SHINY ---
#
#  Después aplicar:
#      nginx -t && systemctl reload nginx
#
#  Resultado:  https://vps-4455523-x.dattaweb.com/sincretismo/
#
#  NOTA: el trailing slash de proxy_pass es OBLIGATORIO. Pisa el prefijo
#  /sincretismo/ y el backend recibe rutas limpias (/config, /api/..., /ws,
#  /game3/). Sin ese slash, nginx manda "/sincretismo/config" y da 404.
# ============================================================================

# /sincretismo  ->  /sincretismo/  (evita el 404 de la barra faltante)
location = /sincretismo {
    return 301 /sincretismo/;
}

location /sincretismo/ {
    proxy_pass http://localhost:6932/;

    proxy_http_version 1.1;

    # WebSocket del bus de eventos (/sincretismo/ws)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sesiones largas (instalación en vivo) y subida de config/JSON
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 25m;
}

# ============================================================================
#  ALTERNATIVA SIN TOCAR NGINX (ya funciona hoy)
# ----------------------------------------------------------------------------
